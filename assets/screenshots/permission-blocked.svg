<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="380" height="720">
  <defs>
    <linearGradient id="primerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Device Frame -->
  <rect x="0" y="0" width="380" height="720" rx="40" fill="#09090b" stroke="#27272a" stroke-width="4"/>
  <rect x="10" y="10" width="360" height="700" rx="32" fill="url(#primerBg)"/>

  <!-- Top notch -->
  <rect x="130" y="18" width="120" height="24" rx="12" fill="#000000"/>

  <!-- Status Label Header -->
  <rect x="90" y="60" width="200" height="28" rx="14" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="78" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ESTADO: BLOQUEADO (BLOCKED)</text>

  <!-- Blocked Icon (Shield / Lock) -->
  <circle cx="190" cy="230" r="44" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
  <text x="190" y="243" font-size="34" text-anchor="middle">🔒</text>

  <!-- PermissionPrimer Card Content -->
  <text x="190" y="320" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">GeoCam necesita tu cámara</text>

  <rect x="36" y="348" width="308" height="70" rx="12" fill="#18181b" fill-opacity="0.8"/>
  <text x="190" y="374" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Desactivaste este permiso de forma permanente.</text>
  <text x="190" y="394" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">Puedes habilitarlo desde los Ajustes del sistema.</text>

  <!-- Open Settings Button (Linking.openSettings()) -->
  <rect x="80" y="450" width="220" height="48" rx="24" fill="url(#btnGrad)"/>
  <text x="190" y="480" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">⚙️ Abrir Ajustes</text>

  <!-- Technical Explanation Footer -->
  <text x="190" y="550" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">Detectado canAskAgain: false</text>
  <text x="190" y="568" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Redirección nativa con Linking.openSettings()</text>
</svg>
